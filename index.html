<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>دستیار قنادی — Sunlight Sweets</title>
<link rel="stylesheet" href="style.css?v=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e08a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دستیار قنادی">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>

<div id="app">
  <div class="app-topbar">
    <img src="logo.png" alt="Sunlight Sweets">
    <span class="app-title">دستیار قنادی</span>
    <button type="button" class="icon-btn" onclick="navigate('settings')">⚙️</button>
  </div>

  <div class="app-main" id="app-main"></div>

  <nav class="bottom-nav">
    <button data-route="reports" onclick="navigate('reports')"><span class="ic">📊</span>گزارش‌ها</button>
    <button data-route="orders" onclick="navigate('orders')"><span class="ic">🧾</span>سفارش‌ها</button>
    <button class="fab" onclick="openOrderForm()"><span>➕</span></button>
    <button data-route="products" onclick="navigate('products')"><span class="ic">🧁</span>محصولات</button>
    <button data-route="dashboard" onclick="navigate('dashboard')"><span class="ic">🏠</span>خانه</button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="printArea" style="display:none"></div>

<script src="xlsx.full.min.js"></script>
<script src="jalali.js"></script>
<script src="db.js"></script>
<script src="seed-data.js"></script>
<script src="app.js"></script>
</body>
</html>
